<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 960" width="1200" height="960" role="img" aria-label="A large kitenge tote resting on a stone plinth in morning light">
  <defs>
    <linearGradient id="wall" x1="0" y1="0" x2="0.4" y2="1"><stop offset="0" stop-color="#f7f2e9"/><stop offset="1" stop-color="#e8dcc9"/></linearGradient>
    <radialGradient id="light" cx="0.28" cy="0.16" r="0.75"><stop offset="0" stop-color="#fffdf6" stop-opacity="1"/><stop offset="1" stop-color="#fffdf6" stop-opacity="0"/></radialGradient>
    <linearGradient id="plinth" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#efe6d6"/><stop offset="1" stop-color="#dbcdb6"/></linearGradient>
    <pattern id="kitenge" width="120" height="120" patternUnits="userSpaceOnUse">
      <rect width="120" height="120" fill="#1d3d68"/>
      <path d="M60 6 L96 60 L60 114 L24 60 Z" fill="#d99a2b"/>
      <path d="M60 34 L78 60 L60 86 L42 60 Z" fill="#b4552f"/>
      <circle cx="60" cy="60" r="7" fill="#f3e6cf"/>
      <circle cx="0" cy="0" r="9" fill="#f3e6cf"/><circle cx="120" cy="0" r="9" fill="#f3e6cf"/>
      <circle cx="0" cy="120" r="9" fill="#f3e6cf"/><circle cx="120" cy="120" r="9" fill="#f3e6cf"/>
      <rect x="0" y="52" width="10" height="16" fill="#3f6b4a"/>
      <rect x="110" y="52" width="10" height="16" fill="#3f6b4a"/>
    </pattern>
    <linearGradient id="shade" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#000" stop-opacity="0.24"/><stop offset="0.42" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity="0.16"/></linearGradient>
    <filter id="blur" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="34"/></filter>
    <filter id="blur2" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="10"/></filter>
  </defs>
  <rect width="1200" height="960" fill="url(#wall)"/>
  <rect width="1200" height="960" fill="url(#light)"/>
  <path d="M120 0 L470 0 L300 960 L0 960 Z" fill="#fffaf0" opacity="0.38" filter="url(#blur2)"/>
  <rect x="300" y="660" width="620" height="26" rx="6" fill="url(#plinth)"/>
  <rect x="330" y="686" width="560" height="220" fill="url(#plinth)" opacity="0.8"/>
  <ellipse cx="612" cy="700" rx="280" ry="26" fill="#c3ac8b" opacity="0.55" filter="url(#blur)"/>

  <!-- kitenge tote -->
  <g transform="translate(392 268)">
    <path d="M110 196 C110 82 278 82 278 196" fill="none" stroke="#6b4a2b" stroke-width="16" stroke-linecap="round"/>
    <path d="M40 182 H348 L366 392 Q367 412 344 412 H44 Q21 412 22 392 Z" fill="url(#kitenge)"/>
    <path d="M40 182 H348 L366 392 Q367 412 344 412 H44 Q21 412 22 392 Z" fill="url(#shade)"/>
    <path d="M40 182 H348" stroke="#6b4a2b" stroke-width="8"/>
    <path d="M52 210 H336" stroke="#f3e6cf" stroke-width="3" stroke-dasharray="10 9" opacity="0.5"/>
    <path d="M40 182 L22 390" stroke="#122744" stroke-width="4" opacity="0.45"/>
    <path d="M348 182 L366 390" stroke="#122744" stroke-width="4" opacity="0.45"/>
    <rect x="170" y="210" width="48" height="76" rx="8" fill="#6b4a2b" opacity="0.92"/>
  </g>

  <!-- folded cloth -->
  <g transform="translate(762 560)">
    <path d="M0 52 L86 26 L168 52 L168 106 L86 132 L0 106 Z" fill="#8c2f2a"/>
    <path d="M0 52 L86 78 L168 52" fill="none" stroke="#e8b64a" stroke-width="7"/>
    <path d="M86 78 V132" stroke="#f3e6cf" stroke-width="4" opacity="0.7"/>
  </g>
</svg>
